<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Notes Intel — Settings</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #080809;
    color: #c8c8d4;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    padding: 28px 28px 24px;
    user-select: none;
    -webkit-app-region: no-drag;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    color: #e0e0ec;
    letter-spacing: .01em;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 0.5px solid #1c1c28;
  }
  .section { margin-bottom: 20px; }
  .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #606070;
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
  }
  .chips { display: flex; gap: 6px; }
  .chip {
    padding: 5px 14px;
    border-radius: 6px;
    border: 0.5px solid #2a2a38;
    background: transparent;
    color: #7a7a90;
    font-size: 12px;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { color: #aaa; background: #141418; }
  .chip.on { background: #0a1a14; color: #5DCAA5; border-color: #1D9E7560; font-weight: 600; }
  .chip.on-openai { background: #0d1525; color: #60a5fa; border-color: #2563eb60; font-weight: 600; }

  input[type="password"], input[type="text"] {
    width: 100%;
    background: #0a0a0d;
    border: 0.5px solid #2a2a38;
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 12px;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    color: #9DCFC0;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: #1D9E7560; }
  input::placeholder { color: #404050; }
  input[readonly] { color: #505060; cursor: default; }

  .folder-row { display: flex; gap: 7px; align-items: center; }
  .folder-row input { flex: 1; font-size: 11px; }
  .browse-btn {
    padding: 8px 13px;
    background: #0a1a14;
    border: 0.5px solid #1D9E7550;
    border-radius: 7px;
    font-size: 11px;
    color: #5DCAA5;
    cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif;
    white-space: nowrap;
    transition: all .15s;
  }
  .browse-btn:hover { background: #0f2a1e; border-color: #5DCAA5; }

  .sub { font-size: 11px; color: #505060; margin-bottom: 7px; line-height: 1.5; }

  .footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 0.5px solid #1c1c28;
  }
  .btn-cancel {
    padding: 8px 16px;
    background: transparent;
    border: 0.5px solid #2a2a38;
    border-radius: 7px;
    font-size: 12px;
    color: #606070;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-save {
    padding: 8px 22px;
    background: #0a1a14;
    border: 0.5px solid #1D9E7550;
    border-radius: 7px;
    font-size: 12px;
    color: #5DCAA5;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .btn-save:hover { background: #0f2a1e; border-color: #5DCAA5; }
  .saved-msg { font-size: 11px; color: #5DCAA5; align-self: center; opacity: 0; transition: opacity .2s; }
  .saved-msg.show { opacity: 1; }

  #openai-key-section { display: none; }
</style>
</head>
<body>

<h1>Settings</h1>

<div class="section">
  <div class="label">AI Provider</div>
  <div class="chips">
    <button class="chip on" id="chip-claude" onclick="selectProvider('claude')">Claude</button>
    <button class="chip" id="chip-openai" onclick="selectProvider('openai')">OpenAI / GPT-4o</button>
  </div>
</div>

<div class="section" id="openai-key-section">
  <div class="label">OpenAI API Key</div>
  <div class="sub">Your key is stored locally on this machine only.</div>
  <input type="password" id="openai-key-inp" placeholder="sk-…" autocomplete="off" spellcheck="false"/>
</div>

<div class="section">
  <div class="label">Export Folder</div>
  <div class="sub">HTML and CSV exports are saved here. Leave empty to use browser download.</div>
  <div class="folder-row">
    <input type="text" id="folder-inp" placeholder="No folder selected" readonly/>
    <button class="browse-btn" onclick="pickFolder()">Browse…</button>
    <button class="browse-btn" style="color:#808090;border-color:#2a2a38;background:transparent;" onclick="clearFolder()">Clear</button>
  </div>
</div>

<div class="footer">
  <span class="saved-msg" id="saved-msg">Saved ✓</span>
  <button class="btn-cancel" onclick="window.close()">Cancel</button>
  <button class="btn-save" onclick="saveSettings()">Save</button>
</div>

<script>
var currentProvider = 'claude';

function selectProvider(p) {
  currentProvider = p;
  document.getElementById('chip-claude').className = 'chip' + (p === 'claude' ? ' on' : '');
  document.getElementById('chip-openai').className = 'chip' + (p === 'openai' ? ' on-openai' : '');
  document.getElementById('openai-key-section').style.display = p === 'openai' ? 'block' : 'none';
}

function pickFolder() {
  fetch('/api/pick-folder').then(r => r.json()).then(d => {
    if (d.path) document.getElementById('folder-inp').value = d.path;
  }).catch(() => {});
}

function clearFolder() {
  document.getElementById('folder-inp').value = '';
}

function saveSettings() {
  var key = (document.getElementById('openai-key-inp').value || '').trim();
  var folder = (document.getElementById('folder-inp').value || '').trim();
  var payload = { provider: currentProvider, folderPath: folder };
  if (key) payload.openaiKey = key;
  fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    var msg = document.getElementById('saved-msg');
    msg.classList.add('show');
    setTimeout(() => { msg.classList.remove('show'); window.close(); }, 900);
  }).catch(() => {});
}

// Load current settings on open
fetch('/api/settings').then(r => r.json()).then(s => {
  selectProvider(s.provider || 'claude');
  if (s.openaiKey) document.getElementById('openai-key-inp').value = s.openaiKey;
  if (s.folderPath) document.getElementById('folder-inp').value = s.folderPath;
}).catch(() => {});
</script>
</body>
</html>
